[package]
name = "muon"
version = "1.6.1"
edition = "2024"

[dependencies]
photon = { path = "./httplib", default-features = false, features = ["asyncffi", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }

clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3+spec-1.1.0"
serde_json = "1.0.151"

regex = "1.13.1"
dashmap = { version = "6.2.1", features = ["serde"] }

rustls = { version = "=0.23.42", default-features = false, features = [] }
tokio-rustls = "=0.26.4"

async-trait = "0.1.91"
# owo-colors = "4.3.0"
phf = { version = "0.14.0", features = [ "macros" ] }
psl = "2.1.221"
base64 = "=0.23.0"

libloading = "0.9.0"
rhai = { version = "1.25.1", features = ["sync"], optional = true }

[features]
default = ["unix-sockets", "handler-simple", "handler-samicpp", "aws-lc-rs"]

unix-sockets = ["photon/unix-sockets"]
ring = ["photon/ring", "rustls/ring"]
aws-lc-rs = ["photon/aws-lc-rs", "rustls/aws-lc-rs"]

handler-simple = []
handler-samicpp = []

rhai-scripting = ["dep:rhai"]
